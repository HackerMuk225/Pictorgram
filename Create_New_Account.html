<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-logo">
        <img style="width: 50px; height: 60px; padding-top: 12px;" src="Logo.png" alt="logo">
        <h1 style="color: rgb(2, 42, 77);">Pictorgram</h1>
    </div>
    <div class="header-motto">
       <P style="color: rgb(2, 42, 77);"> a platform that connect you with family, friends and love ones from around the world!</P>
    </div>
    <div class="Account-field-box">
    <div class="log-box">
        <input id="firstName" type="text" placeholder="First Name">
        <input id="lastName" type="text" placeholder="Last Name">
        <input id="signEmail" type="text" placeholder="Email or Phone number">
        <input id="signPassword" type="password" placeholder="Password">
        <input id="signConfirm" type="password" placeholder="Confirm Password">
        <button id="Sign-Button" type="button">Sign Up</button>
        <a href="index.html"><button type="button" style="border: none; background: transparent; color: rgb(78, 78, 117); padding: 0; font: inherit; cursor: pointer;">Already have an account?</button></a>
    </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="#">English (US)</a>
            <a href="#">Español</a>
            <a href="#">Français (France)</a>
            <a href="#">中文(简体)</a>
            <a href="#">العربية</a>
            <a href="#">Português (Brasil)</a>
            <a href="#">Italiano</a>
            <a href="#">Deutsch</a>
            <a href="#">日本語</a>
            <a href="#">हिन्दी</a>
            <a href="#">More...</a>
        </div>
        <div class="footer-copy">
            <p style="text-align: center;">&copy; 2026 Pictorgram</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
